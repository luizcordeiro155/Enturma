server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: enturma-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/enturma}
    username: ${DATABASE_USERNAME:enturma}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
management:
  health.mail.enabled: false
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
springdoc:
  api-docs.enabled: ${OPENAPI_ENABLED:false}
  swagger-ui.enabled: ${OPENAPI_ENABLED:false}
enturma:
  app-url: ${APP_URL:http://localhost:3000}
  origins: ${CORS_ORIGINS:http://localhost:3000}
  mail-from: ${MAIL_FROM:enturma@localhost}
  room-max-minutes: ${ROOM_MAX_MINUTES:180}
