server:
  address: 0.0.0.0
  port: 80
  shutdown: graceful
spring:
  lifecycle.timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
enturma:
  app-url: ${APP_URL}
  origins: ${CORS_ORIGINS:${APP_URL}}
