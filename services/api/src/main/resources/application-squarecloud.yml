server:
  address: 0.0.0.0
  port: 80
  shutdown: graceful
spring:
  lifecycle.timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Each request waits on the database over the network (Square Cloud to Railway), so the
      # pool, not the CPU, sets throughput. PostgreSQL allows 100 connections by default.
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: 1
      connection-timeout: 10000
enturma:
  app-url: ${APP_URL}
  origins: ${CORS_ORIGINS:${APP_URL}}
