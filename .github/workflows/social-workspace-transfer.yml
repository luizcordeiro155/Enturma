name: Social isolated validation workspace
on:
  push:
    branches: [feat/social-3-part1]
    paths: [.github/workflows/social-workspace-transfer.yml]
permissions:
  contents: read
jobs:
  livekit-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and verify official test runtime
        run: |
          curl --fail --location --retry 2 'https://github.com/livekit/livekit/releases/download/v1.13.11/livekit_1.13.11_linux_amd64.tar.gz' --output /tmp/livekit-runtime.tgz
          echo '1e9ee90ca301e1842b2887fc77cb122759756a9c8aeb4334ee91de3325ec43fb  /tmp/livekit-runtime.tgz' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: social-livekit-runtime
          path: /tmp/livekit-runtime.tgz
          retention-days: 1
          compression-level: 0
