name: Social isolated validation workspace
on:
  push:
    branches: [feat/social-3-part1]
    paths: [.github/workflows/social-workspace-transfer.yml]
permissions:
  contents: write
jobs:
  apply-verified-source:
    if: github.ref == 'refs/heads/feat/social-3-part1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify and reconstruct exact reviewed UTF-8 source files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import prettier from 'prettier';
          const manifest=JSON.parse(fs.readFileSync('.social-transfer/manifest.json','utf8'));
          if(prettier.version!=='3.9.9'||manifest.format!=='zstd-prettier-3.9.9'||manifest.parts!==4)throw Error('Unexpected format');
          const digest=data=>crypto.createHash('sha256').update(data).digest('hex');
          const allowed=p=>typeof p==='string'&&!p.split('/').includes('..')&&!path.isAbsolute(p)&&(p==='DESIGN.md'||p==='UX-CONTRACT.md'||p.startsWith('apps/web/')||p.startsWith('services/api/src/')||p.startsWith('docs/'));
          if(!manifest.files.every(allowed)||new Set(manifest.files).size!==manifest.files.length)throw Error('Unexpected file path');
          const baseline={};
          for(const file of manifest.files){
            let content=fs.existsSync(file)?fs.readFileSync(file,'utf8'):'';
            if(content&&/\.(tsx?|css)$/.test(file))content=await prettier.format(content,{filepath:file});
            baseline[file]=content;
          }
          const base=JSON.stringify(baseline);
          if(digest(base)!==manifest.baseline_sha256)throw Error('Source changed since local validation');
          fs.writeFileSync('/tmp/social-base.json',base);
          const encoded=Array.from({length:manifest.parts},(_,i)=>fs.readFileSync(`.social-transfer/part-${i}.b64`,'utf8')).join('');
          const patch=Buffer.from(encoded,'base64');
          if(digest(patch)!==manifest.sha256)throw Error('Transfer checksum mismatch');
          fs.writeFileSync('/tmp/social-delta.zst',patch);
          execFileSync('zstd',['-d','--patch-from=/tmp/social-base.json','/tmp/social-delta.zst','-o','/tmp/social-target.json']);
          const bytes=fs.readFileSync('/tmp/social-target.json');
          if(digest(bytes)!==manifest.target_sha256)throw Error('Reconstructed source checksum mismatch');
          const target=JSON.parse(bytes);
          if(JSON.stringify(Object.keys(target))!==JSON.stringify(manifest.files))throw Error('Unexpected target file set');
          for(const file of manifest.files){
            if(typeof target[file]!=='string')throw Error('Not UTF-8 text');
            fs.mkdirSync(path.dirname(file),{recursive:true});fs.writeFileSync(file,target[file]);
          }
          execFileSync('git',['add','--',...manifest.files]);
          execFileSync('git',['rm','-r','--','.social-transfer']);
          console.log(`Verified and staged ${manifest.files.length} source files; temporary transfer files removed.`);
          NODE
      - name: Commit to the existing development branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'feat(social): visual Studio, protected live broadcasts and realtime interactions'
          git push origin HEAD:refs/heads/feat/social-3-part1
