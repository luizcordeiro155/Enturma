name: Social gallery regression repair
on:
  push:
    branches: [feat/social-3-part1]
    paths: [.github/workflows/social-gallery-hotfix.yml]
permissions:
  contents: write
concurrency:
  group: social-gallery-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prove the reported gallery regressions before modifying production
        shell: bash
        run: |
          set +e
          npm run test -w @enturma/web -- src/components/social/social-gallery-publication.test.tsx > /tmp/gallery-red.log 2>&1
          result=$?
          set -e
          tail -n 100 /tmp/gallery-red.log
          test "$result" -ne 0
          grep -q 'Failed Tests' /tmp/gallery-red.log
          grep -q 'image/\*' /tmp/gallery-red.log
      - name: Apply bounded source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, f'Expected one exact anchor in {path}: {old!r}'
              p.write_text(text.replace(old, new, 1))
          css = 'apps/web/src/components/social/social-studio.css'
          replace(css, 'html[data-theme] .social-navigation-brand {\n  display: flex;', 'html[data-theme] .social-navigation-brand {\n  display: none;')
          replace(css, '\nhtml[data-theme] .social-navigation-brand .brand-app-icon {', '\n@media (min-width: 761px) {\n  html[data-theme] .social-navigation-brand {\n    display: flex;\n  }\n}\n@media (min-width: 761px) and (max-width: 1199px) {\n  html[data-theme] .social-navigation-brand > span {\n    display: none;\n  }\n}\nhtml[data-theme] .social-navigation-brand .brand-app-icon {')
          editor = 'apps/web/src/components/social/social-editor.tsx'
          replace(editor, 'import { prepareCover } from "@/lib/social-cover";', 'import { prepareCover } from "@/lib/social-cover";\nimport { normalizeSocialGalleryFile } from "@/lib/social-gallery";')
          replace(editor, 'for (const file of files) {\n        if (', 'for (const original of files) {\n        const file = normalizeSocialGalleryFile(original);\n        if (')
          replace(editor, 'accept="image/jpeg,image/png,image/webp,image/gif,video/*"', 'accept={draft.kind === "CLIP" ? "video/*" : "image/*,video/*"}')
          replace(editor, '              <button\n                type="button"\n                className="secondary"\n                disabled={!mediaEnabled || busy || draft.files.length > 0}', '''              {draft.kind !== "CLIP" && (
                          <label className="social-file-button">
                            Fotos da galeria
                            <input
                              type="file"
                              accept="image/*"
                              multiple={draft.kind === "POST"}
                              disabled={!mediaEnabled || busy}
                              onChange={(event) => {
                                void choose(Array.from(event.target.files ?? []));
                                event.target.value = "";
                              }}
                            />
                          </label>
                        )}
                        <button
                          type="button"
                          className="secondary"
                          disabled={!mediaEnabled || busy || draft.files.length > 0}''')
          Path('apps/web/src/lib/social-gallery.ts').write_text('''/** Gallery providers may omit the MIME type. This is only a UI hint:
           * the API and FFmpeg still inspect the actual bytes before publication. */
          const extensions: Record<string, string> = {
            jpg: "image/jpeg", jpeg: "image/jpeg", jpe: "image/jpeg",
            png: "image/png", webp: "image/webp", gif: "image/gif",
            mp4: "video/mp4", m4v: "video/mp4", mov: "video/quicktime",
            webm: "video/webm", mkv: "video/x-matroska", avi: "video/x-msvideo",
            "3gp": "video/3gpp", "3g2": "video/3gpp2",
          };
          export function normalizeSocialGalleryFile(file: File): File {
            if (!file.size || file.size > 128 * 1024 * 1024)
              throw new Error("Escolha uma foto ou vídeo de até 128 MB, que não esteja vazio.");
            let type = file.type.toLowerCase().split(";")[0].trim();
            if (type === "image/jpg" || type === "image/pjpeg") type = "image/jpeg";
            if (type === "image/x-png") type = "image/png";
            if (!type || type === "application/octet-stream")
              type = extensions[file.name.split(".").pop()?.toLowerCase() ?? ""] ?? "";
            if (!/^(image\\/(jpeg|png|webp|gif)$|video\\/)/.test(type))
              throw new Error("Escolha uma foto JPG, PNG, WebP ou GIF, ou um vídeo compatível. Para HEIC/HEIF, exporte a foto como JPG na galeria.");
            return type === file.type ? file : new File([file], file.name, {
              type, lastModified: file.lastModified,
            });
          }
          ''')
          native = 'deploy/android-download/install-web-shell.cjs'
          replace(native, 'import androidx.core.view.ViewCompat', 'import androidx.activity.result.PickVisualMediaRequest\nimport androidx.activity.result.contract.ActivityResultContracts\nimport androidx.core.view.ViewCompat')
          p = Path(native)
          text = p.read_text()
          start = text.index('                if (acceptsImages(params)) {', text.index('            override fun onShowFileChooser('))
          end = text.index('                launchFileChooser(params)', start)
          text = text[:start] + '                // System pickers grant access to selected URIs only.\n                // No blanket storage permission is needed to choose a photo or video.\n' + text[end:]
          start = text.index('    private fun acceptsImages(')
          end = text.index('    private fun openExternal(', start)
          text = text[:start] + '''    private fun acceptedMimeTypes(params: WebChromeClient.FileChooserParams?): List<String> =
                  (params?.acceptTypes ?: emptyArray()).flatMap { it.split(",") }
                      .map { it.trim().lowercase(java.util.Locale.ROOT) }.filter { it.isNotEmpty() }

              private fun documentPicker(params: WebChromeClient.FileChooserParams?): Intent {
                  val types = acceptedMimeTypes(params)
                  return Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = when {
                          types.isNotEmpty() && types.all { it.startsWith("image/") } -> "image/*"
                          types.isNotEmpty() && types.all { it.startsWith("video/") } -> "video/*"
                          types.size == 1 && types[0].contains("/") -> types[0]
                          else -> "*/*"
                      }
                      val mimeTypes = types.filter { it.contains("/") }
                      if (mimeTypes.size > 1) putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes.toTypedArray())
                      putExtra(Intent.EXTRA_ALLOW_MULTIPLE,
                          params?.mode == WebChromeClient.FileChooserParams.MODE_OPEN_MULTIPLE)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
              }

              private fun launchFileChooser(params: WebChromeClient.FileChooserParams?) {
                  pendingFileChooserParams = null
                  val types = acceptedMimeTypes(params)
                  val visualOnly = types.isNotEmpty() && types.all {
                      it.startsWith("image/") || it.startsWith("video/")
                  }
                  try {
                      val intent = if (visualOnly && params?.isCaptureEnabled != true) {
                          val mediaType = when {
                              types.all { it.startsWith("image/") } -> ActivityResultContracts.PickVisualMedia.ImageOnly
                              types.all { it.startsWith("video/") } -> ActivityResultContracts.PickVisualMedia.VideoOnly
                              else -> ActivityResultContracts.PickVisualMedia.ImageAndVideo
                          }
                          val request = PickVisualMediaRequest(mediaType)
                          if (params?.mode == WebChromeClient.FileChooserParams.MODE_OPEN_MULTIPLE)
                              ActivityResultContracts.PickMultipleVisualMedia(10).createIntent(this, request)
                          else ActivityResultContracts.PickVisualMedia().createIntent(this, request)
                      } else if (params?.isCaptureEnabled == true) {
                          params.createIntent()
                      } else documentPicker(params)
                      startActivityForResult(intent, FILE_CHOOSER_REQUEST)
                  } catch (_: ActivityNotFoundException) {
                      try {
                          startActivityForResult(documentPicker(params), FILE_CHOOSER_REQUEST)
                      } catch (_: ActivityNotFoundException) {
                          fileChooserCallback?.onReceiveValue(null)
                          fileChooserCallback = null
                          Toast.makeText(this, "Nenhuma galeria ou seletor de arquivos foi encontrado.", Toast.LENGTH_SHORT).show()
                      }
                  } catch (_: SecurityException) {
                      fileChooserCallback?.onReceiveValue(null)
                      fileChooserCallback = null
                      Toast.makeText(this, "Não foi possível abrir a galeria. Tente novamente.", Toast.LENGTH_SHORT).show()
                  }
              }

          ''' + text[end:]
          assert 'acceptsImages(' not in text, 'Unexpected remaining call to removed helper'
          p.write_text(text)
          carousel = 'apps/web/src/components/social/social-media-carousel.test.tsx'
          replace(carousel, 'limitada a 4:5', 'limitada a 3:4')
          replace(carousel, ').toBe("0.8");', ').toBe("0.75");')
          integration = 'services/api/src/test/java/br/com/enturma/social/SocialMediaIntegrationTest.java'
          replace(integration, '  @Test\n  void malformedMediaKeepsDraftAndFailureIsReal()', '''  @Test
            void galleryPhotoWithEditorRecipeExportsAndPublishesToFeed() throws Exception {
              var source = new ByteArrayOutputStream();
              javax.imageio.ImageIO.write(new java.awt.image.BufferedImage(120, 160,
                  java.awt.image.BufferedImage.TYPE_INT_RGB), "png", source);
              UUID id = UUID.randomUUID(), post = UUID.randomUUID();
              media.create(owner, new SocialMedia.Upload(id, "IMAGE", source.size()));
              media.part(owner, id, 0, body(source.toByteArray()));
              var recipe = new VideoRecipe(List.of(new VideoRecipe.Segment(0, 1)),
                  1, .5, .5, 0, 1, false, 0, List.of(), "4:5", "ORIGINAL", 1.0);
              media.export(owner, id, new SocialMedia.Export(recipe));
              var draft = posts.draft(owner, new SocialPosts.Draft(post, "POST",
                  "Foto da galeria", "PUBLIC", null, 0, List.of(id)));
              media.processOne();
              assertThat(media.status(owner, id)).containsEntry("state", "READY")
                  .containsEntry("width", 720).containsEntry("height", 900);
              posts.publish(owner, post, ((Number) draft.get("version")).intValue());
              assertThat(posts.detail(viewer, post)).containsEntry("id", post);
              var response = new MockHttpServletResponse();
              media.content(viewer, id, false, new MockHttpServletRequest(), response);
              assertThat(response.getContentType()).isEqualTo("image/jpeg");
              assertThat(javax.imageio.ImageIO.read(new ByteArrayInputStream(
                  response.getContentAsByteArray())).getWidth()).isEqualTo(720);
            }

            @Test
            void malformedMediaKeepsDraftAndFailureIsReal()''')
          ledger = Path('docs/superpowers/plans/2026-11-11-social-3-continuation-ledger.md')
          with ledger.open('a') as f:
              f.write('\n## Gallery and mobile follow-up (2026-11-12)\n'
                  '- Mobile logo: studio stylesheet specificity overrode the mobile hide rule; hide by default and opt in at desktop breakpoint.\n'
                  '- Native picker: mixed visual MIME types were forced into image-only ACTION_PICK and broad storage permission. Use AndroidX Photo Picker with image/video scope, multiple selection and document fallback.\n'
                  '- Browser picker: wildcard visual accepts plus an explicit photos-only gallery entry. Normalize absent/generic/legacy MIME hints; actual bytes remain server-validated. HEIC conversion is not claimed.\n'
                  '- Photo publication coverage: UI waits for upload/export/draft/publish confirmation; Java integration processes a real PNG with the same 4:5 recipe and reads the published image as a second user.\n'
                  '- Ruling: local execution unavailable (container ClientError); validation uses isolated existing GitHub CI, not production data. No main merge until checks pass.\n')
          PY
      - name: Verify gallery fixes and all unit tests
        run: |
          npm run test -w @enturma/web -- src/components/social/social-gallery-publication.test.tsx
          npm test
          npm run typecheck
          node --check deploy/android-download/install-web-shell.cjs
      - name: Commit only the scoped changes to the existing feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'Enturma validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/social/social-studio.css apps/web/src/components/social/social-editor.tsx apps/web/src/components/social/social-media-carousel.test.tsx apps/web/src/lib/social-gallery.ts deploy/android-download/install-web-shell.cjs services/api/src/test/java/br/com/enturma/social/SocialMediaIntegrationTest.java docs/superpowers/plans/2026-11-11-social-3-continuation-ledger.md
          git rm .github/workflows/social-gallery-hotfix.yml
          git commit -m 'fix(social): native gallery, photo upload hints and mobile-only dock'
          git push origin HEAD:refs/heads/feat/social-3-part1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-regression-red-evidence
          path: /tmp/gallery-red.log
          retention-days: 3
