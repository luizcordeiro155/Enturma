name: Enturma CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-shell-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Generate the production WebView shell without release credentials
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --no-install --clean
          cd ../..
          node deploy/android-download/install-web-shell.cjs
      - name: Compile Android integration and fullscreen callbacks
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon
  windows-uninstall-safety:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile native UI and verify cleanup on disposable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local | Out-Null
          node apps/desktop/build/build-setup-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /out:.local\SetupUX.Tests.exe (Resolve-Path apps/desktop/build/SetupUX.Tests.cs).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.local\SetupUX.Tests.exe (Resolve-Path apps/desktop/build/EnturmaSetupUX.exe).Path (Join-Path (Get-Location) '.local/uninstall-fixture')
          exit $LASTEXITCODE
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: enturma_test
          POSTGRES_USER: enturma
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U enturma -d enturma_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/enturma_test
      TEST_DATABASE_USERNAME: enturma
      TEST_DATABASE_PASSWORD: ci-ephemeral-only
      DATABASE_PASSWORD: ci-ephemeral-only
      NEXT_TELEMETRY_DISABLED: '1'
      # Public deterministic fixture for isolated tests; never a deployment secret.
      CHAT_ACCOUNT_MASTER_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      SOCIAL_TEST_FFMPEG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install the bounded social media test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: mvn -B -f services/api/pom.xml verify
      - name: Rehearse backup restoration on synthetic database
        env:
          PGHOST: 127.0.0.1
          PGUSER: enturma
          PGPASSWORD: ci-ephemeral-only
          PGDATABASE: enturma_test
        run: bash scripts/verify-isolated-restore.sh
      - name: Resolved Java dependency audit (OSV)
        run: node scripts/audit-java-dependencies.mjs
      - run: npm ci
      - run: node scripts/check-doc-links.mjs
      - name: Capture npm dependency advisories
        run: npm audit --json > dist/security/npm-audit.json || test -s dist/security/npm-audit.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx expo export --platform android --output-dir ../../dist/mobile-android
        working-directory: apps/mobile
      - run: npx expo export --platform ios --output-dir ../../dist/mobile-ios
        working-directory: apps/mobile
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare isolated LiveKit runtime
        run: |
          curl --fail --location --retry 2 https://github.com/livekit/livekit/releases/download/v1.13.11/livekit_1.13.11_linux_amd64.tar.gz --output /tmp/livekit-runtime.tgz
          echo "1e9ee90ca301e1842b2887fc77cb122759756a9c8aeb4334ee91de3325ec43fb  /tmp/livekit-runtime.tgz" | sha256sum --check
          mkdir -p /tmp/livekit-runtime
          tar -xzf /tmp/livekit-runtime.tgz -C /tmp/livekit-runtime
          printf "port: 17880\nbind_addresses: [127.0.0.1]\nrtc:\n  tcp_port: 17881\n  udp_port: 17882\n  use_external_ip: false\n  node_ip: 127.0.0.1\nkeys:\n  localqa: local-only-test-key-for-livekit-no-credentials\n" > /tmp/livekit-qa.yaml
          /tmp/livekit-runtime/livekit-server --config /tmp/livekit-qa.yaml --dev > /tmp/enturma-livekit.log 2>&1 &
      - name: Prepare isolated E2E database and services
        env:
          PGPASSWORD: ci-ephemeral-only
        run: |
          psql -h localhost -U enturma -d enturma_test -c 'CREATE DATABASE enturma_e2e'
          node apps/web/e2e/mail-server.cjs > /tmp/enturma-smtp.log 2>&1 &
          SOCIAL_ENABLED=true SOCIAL_LIVE_ENABLED=true VOICE_ENABLED=true LIVEKIT_URL=ws://127.0.0.1:17880 LIVEKIT_API_KEY=localqa LIVEKIT_API_SECRET=local-only-test-key-for-livekit-no-credentials DATABASE_URL=jdbc:postgresql://localhost:5432/enturma_e2e DATABASE_USERNAME=enturma APP_URL=http://localhost:3000 AUTH_REGISTER_RATE_LIMIT=500 MAIL_ENABLED=true MAIL_HOST=127.0.0.1 MAIL_PORT=1025 MAIL_AUTH=false MAIL_TLS=false java -jar services/api/target/enturma-api-0.1.0.jar --spring.profiles.active=squarecloud --server.port=8080 > /tmp/enturma-api.log 2>&1 &
          API_URL=http://localhost:8080 APP_URL=http://localhost:3000 npm run start -w @enturma/web > /tmp/enturma-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health && curl -fsS http://localhost:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm run test:e2e -w @enturma/web
        env:
          E2E_LIVEKIT: 'true'
          E2E_DATABASE_URL: postgresql://enturma:ci-ephemeral-only@localhost:5432/enturma_e2e
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/package-squarecloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: squarecloud-api
          path: |
            dist/enturma-squarecloud.zip
            dist/enturma-squarecloud.zip.sha256
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-evidence
          path: |
            apps/web/test-results/**/*.png
            apps/web/test-results/**/*.json
            dist/security/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            services/api/target/surefire-reports
            apps/web/test-results
            /tmp/enturma-api.log
            /tmp/enturma-web.log
            /tmp/enturma-livekit.log
