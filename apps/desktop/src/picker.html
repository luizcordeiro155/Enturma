<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Compartilhar tela - Enturma</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif;background:#0f1917;color:#f5f7f6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#17352d 0,#0f1917 48%,#0a1110 100%)}
    header{padding:28px 30px 18px;border-bottom:1px solid #29413b;position:sticky;top:0;background:rgba(15,25,23,.94);backdrop-filter:blur(12px);z-index:3}
    h1{font-size:24px;margin:0 0 6px}p{margin:0;color:#b8c7c2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:24px 30px 92px}
    button.source{appearance:none;border:1px solid #324b44;border-radius:18px;background:#14221f;color:inherit;padding:10px;text-align:left;cursor:pointer;transition:.18s transform,.18s border-color,.18s background}
    button.source:hover,button.source:focus-visible{transform:translateY(-2px);border-color:#d9f56d;background:#182b26;outline:none;box-shadow:0 0 0 3px rgba(217,245,109,.12)}
    .thumb{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:#09110f;display:block}.meta{display:flex;align-items:center;gap:10px;padding:12px 4px 4px}.meta img{width:24px;height:24px;object-fit:contain}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:14px}
    footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:flex-end;padding:16px 30px;border-top:1px solid #29413b;background:rgba(15,25,23,.96);backdrop-filter:blur(12px)}
    .cancel{border:1px solid #3b514b;background:#17231f;color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer}.empty{grid-column:1/-1;padding:42px;text-align:center;color:#b8c7c2}
  </style>
</head>
<body>
  <header>
    <h1>O que você quer compartilhar?</h1>
    <p>Escolha uma tela ou janela. O Enturma só compartilha depois da sua escolha.</p>
  </header>
  <main id="sources" class="grid" aria-live="polite">
    <div class="empty">Carregando telas e janelas…</div>
  </main>
  <footer><button id="cancel" class="cancel" type="button">Cancelar</button></footer>
  <script>
    const root=document.getElementById("sources");
    document.getElementById("cancel").addEventListener("click",()=>window.enturmaDesktopPicker.cancel());
    window.enturmaDesktopPicker.onSources((sources)=>{
      root.textContent="";
      if(!sources.length){root.innerHTML='<div class="empty">Nenhuma tela ou janela disponível.</div>';return;}
      for(const source of sources){
        const button=document.createElement("button");button.type="button";button.className="source";button.title=source.name;
        const thumb=document.createElement("img");thumb.className="thumb";thumb.src=source.thumbnail;thumb.alt="Prévia de "+source.name;
        const meta=document.createElement("div");meta.className="meta";
        if(source.icon){const icon=document.createElement("img");icon.src=source.icon;icon.alt="";meta.appendChild(icon);}
        const name=document.createElement("span");name.className="name";name.textContent=source.name;meta.appendChild(name);
        button.append(thumb,meta);button.addEventListener("click",()=>window.enturmaDesktopPicker.select(source.id));root.appendChild(button);
      }
    });
  </script>
</body>
</html>
